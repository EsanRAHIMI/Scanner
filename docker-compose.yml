services:
  frontend:
    build:
      context: ./frontend
    environment:
      - NODE_ENV=production
    expose:
      - "3003"

  backend:
    build:
      context: ./backend
    environment:
      - MODEL_PATH=/models/best.pt
    volumes:
      - ./backend/models:/models:ro
    expose:
      - "8000"

  # Image service (background removal / cutout + standardized renditions).
  image-server:
    build:
      context: ./image/server
    environment:
      - IMAGE_STORAGE_ROOT=/data/storage
      - U2NET_HOME=/data/models
      # Set MONGODB_URI / S3 / managed-API vars via Dokploy env, not here.
    volumes:
      # Persists cutouts, renditions, and downloaded model weights across redeploys.
      - image_data:/data
    expose:
      - "8020"

  image-web:
    build:
      context: ./image/web
    environment:
      - NODE_ENV=production
      - IMAGE_API_BASE=http://image-server:8020
    expose:
      - "3006"

  # Proposal builder API (templates, generation, Playwright PDF export).
  proposals-server:
    build:
      context: ./proposals/server
    environment:
      - PROPOSALS_STORAGE_ROOT=/data/storage
      # Set MONGODB_URI / TRAINER_JWT_SECRET / S3 vars via Dokploy env, not here.
    volumes:
      # Persists generated PDFs and uploaded proposal assets across redeploys.
      - proposals_data:/data
    expose:
      - "8030"

  proposals-web:
    build:
      context: ./proposals/web
    environment:
      - NODE_ENV=production
      - PROPOSALS_API_BASE=http://proposals-server:8030
    expose:
      - "3007"

  # Central AI agent service (chat + memory + embeddable widget).
  agent-server:
    build:
      context: ./agent/server
    environment:
      - MONGODB_DB_NAME=lorenzo_agent
      - PLATFORM_DB_NAME=lorenzodb
      - IMAGE_API_BASE=http://image-server:8020
      # Set MONGODB_URI / TRAINER_JWT_SECRET / LLM keys via Dokploy env, not here.
    expose:
      - "8040"

volumes:
  image_data:
  proposals_data:
